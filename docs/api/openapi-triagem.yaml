openapi: 3.0.3
info:
  title: SaúdeConecta — Serviço de Triagem IA
  version: 1.0.0
  description: |
    Classificação de urgência (LLM + RAG sobre protocolos médicos) e orientação pré-consulta.
    Bancos: MongoDB (triagens) + ChromaDB (vetores). A classificação segue o Protocolo de Manchester (5 níveis).
servers:
  - url: https://api.saudeconecta.local/api/v1
    description: Via API Gateway
tags:
  - name: Triagens
paths:
  /triagens:
    post:
      tags: [Triagens]
      summary: (SAGA passo 1) Classifica urgência a partir dos sintomas
      description: |
        Latência alvo p95 <= 8 s. Resultado é **temporário** até o evento `AgendamentoCriado`.
        Com o LLM indisponível responde `201` por regras (`origem: REGRAS`), sem falhar a SAGA.
        O modelo apenas **sugere**; a decisão clínica final é do profissional.
      parameters:
        - { name: X-Saga-Id, in: header, required: true, description: SAGA que criou a triagem, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriagemRequest' }
      responses:
        '201':
          description: Classificação gerada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Triagem' }
        '422':
          description: Sintomas insuficientes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Triagens]
      summary: (SAGA compensação) Descarta as classificações temporárias da SAGA
      parameters:
        - { name: sagaId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Descartadas (idempotente) }
        '400': { description: sagaId ausente }
  /triagens/recomendacoes:
    post:
      tags: [Triagens]
      summary: Classifica e recomenda horários reais (antes da SAGA)
      description: |
        Usa a mesma classificação e, em seguida, a tool `consultar_horarios`, que lê `GET /slots` do
        serviço de Agendamento. Não grava triagem. VERMELHO não traz horários: orienta atendimento imediato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sintomas, ubsId]
              properties:
                sintomas: { type: string }
                idade: { type: integer }
                ubsId: { type: string, format: uuid }
      responses:
        '200':
          description: Recomendação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recomendacao' }
        '422': { description: Sintomas insuficientes }
  /triagens/saude-llm:
    get:
      tags: [Triagens]
      summary: Estado do circuit breaker, cache e fallback
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  circuito: { type: string, enum: [FECHADO, ABERTO, MEIO_ABERTO] }
                  chamadas: { type: integer }
                  acertosCache: { type: integer }
                  fallbacks: { type: integer }
  /triagens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Triagens]
      summary: Consulta triagem
      responses:
        '200':
          description: Triagem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Triagem' }
        '404': { description: Não encontrada }
  /triagens/{id}/orientacoes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Triagens]
      summary: Orientações pré-consulta
      responses:
        '200':
          description: Orientações com as fontes do protocolo (RAG)
          content:
            application/json:
              schema:
                type: object
                properties:
                  orientacoes:
                    type: array
                    items: { type: string }
                  fontes:
                    type: array
                    items: { type: string, example: 'Protocolo de Acolhimento MS, p. 42' }
  /triagens/{id}/feedback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Triagens]
      summary: Registra classificação do médico (métrica de concordância > 85%)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classificacaoMedico]
              properties:
                classificacaoMedico: { $ref: '#/components/schemas/Urgencia' }
      responses:
        '204': { description: Feedback registrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Urgencia:
      type: string
      enum: [VERMELHO, LARANJA, AMARELO, VERDE, AZUL]
    TriagemRequest:
      type: object
      required: [pacienteId, sintomas]
      properties:
        pacienteId: { type: string, format: uuid }
        sintomas: { type: string, example: Dor de cabeça forte há 3 dias e febre }
        idade: { type: integer }
    Triagem:
      type: object
      properties:
        id: { type: string }
        pacienteId: { type: string, format: uuid }
        classificacao: { $ref: '#/components/schemas/Urgencia' }
        justificativa: { type: string }
        especialidadeSugerida: { type: string }
        confianca: { type: number, format: float, minimum: 0, maximum: 1 }
        temporaria: { type: boolean }
        origem: { type: string, enum: [LLM, CACHE, REGRAS], description: Como a classificação foi obtida }
        fontes:
          type: array
          items: { $ref: '#/components/schemas/Fonte' }
        criadoEm: { type: string, format: date-time }
    Fonte:
      type: object
      properties:
        documento: { type: string, example: 'Caderno de Atenção Básica nº 28, vol. II' }
        secao: { type: string }
        pagina: { type: integer }
    Recomendacao:
      type: object
      properties:
        classificacao: { $ref: '#/components/schemas/Urgencia' }
        justificativa: { type: string }
        especialidadeSugerida: { type: string }
        prazoMaximoHoras: { type: integer }
        origem: { type: string, enum: [LLM, CACHE, REGRAS] }
        fontes:
          type: array
          items: { $ref: '#/components/schemas/Fonte' }
        horarios:
          type: array
          items:
            type: object
            properties:
              slotId: { type: string, format: uuid }
              inicio: { type: string, format: date-time }
              especialidade: { type: string }
        orientacao: { type: string }
    Problem:
      type: object
      description: RFC 7807 (Problem Details)
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
security:
  - bearerAuth: []
