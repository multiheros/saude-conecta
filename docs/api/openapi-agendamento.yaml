openapi: 3.0.3
info:
  title: SaúdeConecta — Serviço de Agendamento
  version: 1.0.0
  description: |
    Slots, reservas, disponibilidade e escalas. Write model em PostgreSQL;
    leituras (`GET`) servidas pelo Read Model (CQRS — ver `docs/arquitetura/cqrs-agendamento.md`).
    O recurso `GET /agendamentos/{id}` é **HATEOAS**: o objeto `_links` expõe
    apenas as ações permitidas para o estado atual do agendamento.
servers:
  - url: https://api.saudeconecta.local/api/v1
    description: Via API Gateway
tags:
  - name: Agendamentos
  - name: Slots
  - name: Escalas
  - name: SAGA
paths:
  /slots:
    get:
      tags: [Slots]
      summary: Consulta disponibilidade de horários
      parameters:
        - { name: ubsId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: especialidade, in: query, schema: { type: string } }
        - { name: dataInicio, in: query, schema: { type: string, format: date } }
        - { name: dataFim, in: query, schema: { type: string, format: date } }
      responses:
        '400': { description: Parâmetros inválidos }
        '503': { $ref: '#/components/responses/LeituraIndisponivel' }
        '200':
          description: Slots disponíveis (Read Model). No máximo 200, do mais próximo ao mais distante
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }
  /agendamentos:
    post:
      tags: [Agendamentos]
      summary: Solicita agendamento (inicia a SAGA)
      description: |
        O id já existe na resposta `202`. A reserva do slot (passo 3) é transação local do orquestrador,
        sem endpoint próprio.
      parameters:
        - { name: Idempotency-Key, in: header, description: Evita SAGA duplicada em reenvio, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgendamentoCreate' }
      responses:
        '202':
          description: SAGA iniciada; acompanhar pelo recurso retornado
          headers:
            Location:
              schema: { type: string }
              example: /api/v1/agendamentos/3fa85f64-5717-4562-b3fc-2c963f66afa6?versaoMinima=0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '403': { description: Só o próprio paciente (ou gestor) }
        '422':
          description: Dados inválidos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Agendamentos]
      summary: Lista agendamentos (filtrável)
      parameters:
        - { name: pacienteId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusAgendamento' } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Página de agendamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agendamento' }
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
        '503': { $ref: '#/components/responses/LeituraIndisponivel' }
  /agendamentos/{id}:
    parameters:
      - { $ref: '#/components/parameters/AgendamentoId' }
    get:
      tags: [Agendamentos]
      summary: Obtém agendamento (HATEOAS)
      parameters:
        - { name: versaoMinima, in: query, description: Espera até 2 s a leitura alcançar esta versão (read-your-writes), schema: { type: integer, minimum: 0 } }
      description: |
        Os links variam conforme `status`:

        | status | links |
        |--------|-------|
        | PENDENTE | self |
        | AGENDADO | self, confirmar, reagendar, cancelar |
        | CONFIRMADO | self, reagendar, cancelar |
        | CANCELADO / REALIZADO / FALTOU | self |
      responses:
        '200':
          description: Agendamento com `_links`
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AgendamentoHateoas' }
              examples:
                agendado:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    status: AGENDADO
                    pacienteId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    slotId: 9b2d5c1e-0a4f-4c8e-8f35-1d6f2f9a7b10
                    dataHora: '2026-11-05T09:30:00-03:00'
                    especialidade: Clínica Geral
                    classificacaoUrgencia: AMARELO
                    _links:
                      self: { href: /api/v1/agendamentos/3fa85f64-5717-4562-b3fc-2c963f66afa6, method: GET }
                      confirmar: { href: /api/v1/agendamentos/3fa85f64-5717-4562-b3fc-2c963f66afa6/confirmacao, method: POST }
                      reagendar: { href: /api/v1/agendamentos/3fa85f64-5717-4562-b3fc-2c963f66afa6/reagendamento, method: POST }
                      cancelar: { href: /api/v1/agendamentos/3fa85f64-5717-4562-b3fc-2c963f66afa6/cancelamento, method: POST }
        '503': { $ref: '#/components/responses/LeituraIndisponivel' }
        '404':
          description: Não encontrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /agendamentos/{id}/confirmacao:
    parameters:
      - { $ref: '#/components/parameters/AgendamentoId' }
    post:
      tags: [Agendamentos]
      summary: Confirma presença
      responses:
        '200':
          description: Confirmado
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AgendamentoHateoas' }
        '409': { description: Transição de estado inválida }
  /agendamentos/{id}/reagendamento:
    parameters:
      - { $ref: '#/components/parameters/AgendamentoId' }
    post:
      tags: [Agendamentos]
      summary: Reagenda para outro slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [novoSlotId]
              properties:
                novoSlotId: { type: string, format: uuid }
      responses:
        '200':
          description: Reagendado
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AgendamentoHateoas' }
        '409': { description: 'Slot indisponível, de outra especialidade ou transição inválida' }
  /agendamentos/{id}/cancelamento:
    parameters:
      - { $ref: '#/components/parameters/AgendamentoId' }
    post:
      tags: [Agendamentos]
      summary: Cancela agendamento e libera o slot
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
      responses:
        '200':
          description: Cancelado
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AgendamentoHateoas' }
        '409': { description: Transição de estado inválida }
  /agendamentos/{id}/comparecimento:
    parameters:
      - { $ref: '#/components/parameters/AgendamentoId' }
    post:
      tags: [Agendamentos]
      summary: Registra atendimento realizado ou falta (perfil gestor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compareceu]
              properties:
                compareceu: { type: boolean }
      responses:
        '200':
          description: Status passa a REALIZADO ou FALTOU
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AgendamentoHateoas' }
        '403': { description: Apenas perfil gestor }
        '409': { description: Transição de estado inválida }
  /sagas/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAGA]
      summary: Auditoria da SAGA (passos, compensações e horários)
      responses:
        '200':
          description: Estado da SAGA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saga' }
        '404': { description: Não encontrada }
  /relatorios/ocupacao:
    get:
      tags: [Agendamentos]
      summary: Indicadores agregados de ocupação e absenteísmo (bff-admin)
      description: |
        Servido pelo Read Model (CQRS). O mês é o da consulta. Defasagem ≤ 5 s; `defasagemSegundos` é o
        atraso do último evento projetado. Apenas perfil `gestor`; não contém dados pessoais.
      parameters:
        - { name: ubsId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: periodo, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' } }
        - { name: especialidade, in: query, schema: { type: string } }
      responses:
        '200':
          description: Agregados do período
          content:
            application/json:
              schema:
                type: object
                properties:
                  ubsId: { type: string, format: uuid }
                  periodo: { type: string, example: '2026-11' }
                  slotsTotais: { type: integer }
                  reservados: { type: integer }
                  ocupacaoPercentual: { type: number }
                  porStatus:
                    type: object
                    additionalProperties: { type: integer }
                  porUrgencia:
                    description: Não conta cancelados
                    type: object
                    additionalProperties: { type: integer }
                  taxaAbsenteismo: { type: number, description: Faltas sobre comparecimentos registrados (%) }
                  serieDiaria:
                    type: array
                    items:
                      type: object
                      properties:
                        data: { type: string, format: date }
                        agendados: { type: integer }
                        faltas: { type: integer }
                  defasagemSegundos: { type: number, nullable: true }
        '400': { description: Parâmetros inválidos }
        '403': { description: Apenas perfil gestor }
        '503': { $ref: '#/components/responses/LeituraIndisponivel' }
  /escalas:
    post:
      tags: [Escalas]
      summary: Cria escala de profissional (gera slots)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalaCreate' }
      responses:
        '201':
          description: Escala criada e slots gerados (horários já existentes ou sobrepostos são ignorados)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  slotsGerados: { type: integer }
        '422': { description: Dados inválidos }
        '403': { description: Apenas perfil gestor }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AgendamentoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    LeituraIndisponivel:
      description: Modelo de leitura fora do ar; os comandos continuam
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    StatusAgendamento:
      type: string
      enum: [PENDENTE, AGENDADO, CONFIRMADO, CANCELADO, REALIZADO, FALTOU]
    Slot:
      type: object
      properties:
        id: { type: string, format: uuid }
        ubsId: { type: string, format: uuid }
        profissionalId: { type: string, format: uuid }
        especialidade: { type: string }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        status: { type: string, enum: [LIVRE, RESERVADO, BLOQUEADO] }
    AgendamentoCreate:
      type: object
      required: [pacienteId, slotId, sintomas]
      properties:
        pacienteId: { type: string, format: uuid }
        slotId: { type: string, format: uuid }
        sintomas: { type: string, minLength: 10, maxLength: 2000, description: Texto livre enviado à triagem e apagado daqui em seguida }
        idade: { type: integer, description: Informada pelo BFF a partir do perfil; melhora a triagem }
    Agendamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusAgendamento' }
        pacienteId: { type: string, format: uuid }
        pacienteNome: { type: string, description: Só nas consultas }
        slotId: { type: string, format: uuid }
        dataHora: { type: string, format: date-time }
        especialidade: { type: string }
        classificacaoUrgencia: { type: string, enum: [VERMELHO, LARANJA, AMARELO, VERDE, AZUL] }
        sagaId: { type: string, format: uuid }
        motivo: { type: string, description: Preenchido quando CANCELADO }
        profissional:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            especialidade: { type: string }
        ubs:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            endereco: { type: string }
        versao: { type: integer, description: Versão do agendamento; use em `versaoMinima` }
        atualizadoEm: { type: string, format: date-time, description: Instante da escrita }
        projetadoEm: { type: string, format: date-time, description: Instante da projeção (CQRS); só nas consultas }
    Link:
      type: object
      required: [href]
      properties:
        href: { type: string }
        method: { type: string, enum: [GET, POST, PUT, DELETE] }
    AgendamentoHateoas:
      allOf:
        - { $ref: '#/components/schemas/Agendamento' }
        - type: object
          properties:
            _links:
              type: object
              required: [self]
              properties:
                self: { $ref: '#/components/schemas/Link' }
                confirmar: { $ref: '#/components/schemas/Link' }
                reagendar: { $ref: '#/components/schemas/Link' }
                cancelar: { $ref: '#/components/schemas/Link' }
    Saga:
      type: object
      properties:
        id: { type: string, format: uuid }
        agendamentoId: { type: string, format: uuid }
        estado: { type: string, enum: [EM_ANDAMENTO, CONCLUIDA, COMPENSANDO, COMPENSACAO_PENDENTE, FALHOU] }
        motivo: { type: string }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
        historico:
          type: array
          items:
            type: object
            properties:
              passo: { type: string, enum: [1-triagem, 2-pacientes, 3-reserva, 4-notificacoes] }
              tipo: { type: string, enum: [ACAO, COMPENSACAO] }
              resultado: { type: string, enum: [OK, FALHA, PENDENTE] }
              detalhe: { type: string }
              duracaoMs: { type: integer }
              em: { type: string, format: date-time }
    EscalaCreate:
      type: object
      required: [profissionalId, ubsId, diaSemana, horaInicio, horaFim, duracaoSlotMin]
      properties:
        profissionalId: { type: string, format: uuid }
        ubsId: { type: string, format: uuid }
        diaSemana: { type: integer, minimum: 1, maximum: 7 }
        horaInicio: { type: string, example: '08:00' }
        horaFim: { type: string, example: '12:00' }
        duracaoSlotMin: { type: integer, minimum: 5, maximum: 240, example: 30 }
        semanas: { type: integer, minimum: 1, maximum: 12, default: 4, description: Quantas semanas gerar a partir de hoje }
    Problem:
      type: object
      description: RFC 7807 (Problem Details)
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
security:
  - bearerAuth: []
