server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Repetidos em cada location porque add_header nao se herda quando ha outro no bloco.
  location = /vivo { return 200; }
  location ~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable"; # o nome do arquivo muda a cada build
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
    try_files $uri $uri/index.html =404;
  }
}
