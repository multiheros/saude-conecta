# Gateway da stack Compose (equivalente ao Ingress do Kubernetes).
# Regras de roteamento conforme docs/gateway-routing.md.
upstream bff_web   { server bff-web:3001; }
upstream bff_admin { server bff-admin:3002; }
upstream pacientes { server pacientes:8001; }
upstream agendamento { server agendamento:8002; }
upstream triagem   { server triagem:8003; }
upstream notificacoes { server notificacoes:8004; }

server {
  listen 80;
  add_header X-Gateway "saudeconecta-nginx" always;

  location /web/v1/   { proxy_pass http://bff_web/;   include /etc/nginx/proxy.conf; }
  location /admin/v1/ { proxy_pass http://bff_admin/; include /etc/nginx/proxy.conf; }

  # preferencias de notificacao pertencem ao servico de Notificacoes (precedencia sobre /pacientes)
  location ~ ^/api/v1/pacientes/[^/]+/preferencias-notificacao$ { proxy_pass http://notificacoes; include /etc/nginx/proxy.conf; }

  location /api/v1/auth/        { proxy_pass http://pacientes; include /etc/nginx/proxy.conf; }
  location /api/v1/pacientes    { proxy_pass http://pacientes; include /etc/nginx/proxy.conf; }
  location ~ ^/api/v1/(agendamentos|slots|escalas|relatorios) { proxy_pass http://agendamento; include /etc/nginx/proxy.conf; }
  location /api/v1/triagens     { proxy_pass http://triagem; include /etc/nginx/proxy.conf; }
  location /api/v1/notificacoes { proxy_pass http://notificacoes; include /etc/nginx/proxy.conf; }

  location = /health { return 200 "ok\n"; }
}
