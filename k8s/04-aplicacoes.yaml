apiVersion: v1
kind: Service
metadata: { name: triagem, namespace: saudeconecta }
spec:
  selector: { app: triagem }
  ports: [{ port: 8003, targetPort: 8003 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: triagem, namespace: saudeconecta }
spec:
  replicas: 2
  selector: { matchLabels: { app: triagem } }
  template:
    metadata: { labels: { app: triagem, camada: dominio } }
    spec:
      enableServiceLinks: false # evita variaveis como RABBITMQ_PORT=tcp://...
      containers:
        - name: triagem
          image: saudeconecta/triagem:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8003 }]
          envFrom: [{ configMapRef: { name: saudeconecta-config } }]
          env:
            - name: CHROMA_HOST
              valueFrom: { configMapKeyRef: { name: saudeconecta-config, key: TRIAGEM_VETORES_HOST } }
            # Criado a mao, nunca versionado (docs/containerizacao.md). Sem ele, a triagem trabalha por regras.
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: triagem-llm, key: GEMINI_API_KEY, optional: true } }
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: saudeconecta-config, key: TRIAGEM_DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: saudeconecta-config, key: TRIAGEM_DB_PORT } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: triagem-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: triagem-db, key: DB_PASSWORD } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            httpGet: { path: /ready, port: 8003 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /live, port: 8003 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 800Mi } # modelo de embeddings em memoria
            limits: { cpu: "1", memory: 1200Mi }
---
# Carrega a base de conhecimento no ChromaDB; se ja estiver carregada, nao faz nada. Some 10 min depois de
# terminar, para poder ser aplicado de novo.
apiVersion: batch/v1
kind: Job
metadata: { name: triagem-ingestao, namespace: saudeconecta }
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 10
  template:
    metadata: { labels: { app: triagem-ingestao, camada: dominio } }
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: ingestao
          image: saudeconecta/triagem:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.rag.ingestao"]
          env:
            - name: CHROMA_HOST
              valueFrom: { configMapKeyRef: { name: saudeconecta-config, key: TRIAGEM_VETORES_HOST } }
            - { name: EMBEDDING_THREADS, value: "4" } # igual ao limite de CPU
          resources:
            requests: { cpu: 200m, memory: 800Mi }
            limits: { cpu: "4", memory: 1500Mi }
---
