---
apiVersion: v1
kind: Service
metadata: { name: pacientes, namespace: saudeconecta }
spec:
  selector: { app: pacientes }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pacientes, namespace: saudeconecta }
spec:
  replicas: 2
  selector: { matchLabels: { app: pacientes } }
  template:
    metadata: { labels: { app: pacientes, camada: dominio } }
    spec:
      securityContext: { fsGroup: 1000 }
      volumes: [{ name: jwt, secret: { secretName: jwt-privada, defaultMode: 0440 } }] # scripts/k8s-chaves.sh
      enableServiceLinks: false # evita variaveis como RABBITMQ_PORT=tcp://...
      containers:
        - name: pacientes
          image: saudeconecta/pacientes:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8001 }]
          envFrom: [{ configMapRef: { name: saudeconecta-config } }]
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: saudeconecta-config, key: PACIENTES_DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: saudeconecta-config, key: PACIENTES_DB_PORT } }
            - { name: DB_NAME, value: pacientes }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: pacientes-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pacientes-db, key: DB_PASSWORD } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: rabbitmq, key: RABBITMQ_PASSWORD } }
            - { name: JWT_CHAVE_PRIVADA, value: /chaves/jwt.pem }
            - { name: SEED, value: "true" } # dados ficticios de demonstracao
          volumeMounts: [{ name: jwt, mountPath: /chaves, readOnly: true }]
          readinessProbe:
            httpGet: { path: /ready, port: 8001 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
