apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: saudeconecta }
spec:
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672 }, { name: mgmt, port: 15672 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rabbitmq, namespace: saudeconecta }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq, camada: mensageria } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: saudeconecta-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: saudeconecta-secrets, key: RABBITMQ_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
          readinessProbe:
            tcpSocket: { port: 5672 }
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
