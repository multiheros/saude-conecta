# Entrada do cluster: tudo vai para o gateway (Kong), a unica fonte de rotas. Regras: docs/gateway-routing.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saudeconecta
  namespace: saudeconecta
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "20"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: gateway, port: { number: 8000 } } } }
