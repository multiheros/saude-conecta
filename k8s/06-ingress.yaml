# Ingress = gateway do cluster (regras de docs/gateway-routing.md).
# Ingress 1: BFFs, com remocao do prefixo (equivale a strip_path=true).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saudeconecta-bffs
  namespace: saudeconecta
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /web/v1(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: bff-web, port: { number: 3001 } } }
          - path: /admin/v1(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: bff-admin, port: { number: 3002 } } }
---
# Ingress 2: APIs dos servicos, caminho completo preservado (strip_path=false).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saudeconecta-api
  namespace: saudeconecta
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /api/v1/pacientes, pathType: Prefix, backend: { service: { name: pacientes, port: { number: 8001 } } } }
          - { path: /api/v1/auth, pathType: Prefix, backend: { service: { name: pacientes, port: { number: 8001 } } } }
          - { path: /api/v1/agendamentos, pathType: Prefix, backend: { service: { name: agendamento, port: { number: 8002 } } } }
          - { path: /api/v1/slots, pathType: Prefix, backend: { service: { name: agendamento, port: { number: 8002 } } } }
          - { path: /api/v1/escalas, pathType: Prefix, backend: { service: { name: agendamento, port: { number: 8002 } } } }
          - { path: /api/v1/relatorios, pathType: Prefix, backend: { service: { name: agendamento, port: { number: 8002 } } } }
          - { path: /api/v1/triagens, pathType: Prefix, backend: { service: { name: triagem, port: { number: 8003 } } } }
          - { path: /api/v1/notificacoes, pathType: Prefix, backend: { service: { name: notificacoes, port: { number: 8004 } } } }
---
# Ingress 3: preferencias pertencem ao servico de Notificacoes, embora o caminho
# comece com /pacientes. O caminho mais longo (regex) vence o prefixo /api/v1/pacientes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saudeconecta-preferencias
  namespace: saudeconecta
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/pacientes/[^/]+/preferencias-notificacao$
            pathType: ImplementationSpecific
            backend: { service: { name: notificacoes, port: { number: 8004 } } }
