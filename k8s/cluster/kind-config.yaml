# Cluster local para a demonstracao. Expoe o Ingress em http://localhost:8081
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: saudeconecta
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 8081, protocol: TCP }
