# Database per Service na rede: cada banco so aceita conexao do seu servico.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: db-pacientes, namespace: saudeconecta }
spec:
  podSelector: { matchLabels: { app: db-pacientes } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: pacientes } } }]
      ports: [{ protocol: TCP, port: 5432 }]
---
