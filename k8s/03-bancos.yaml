---
apiVersion: v1
kind: Service
metadata: { name: db-pacientes, namespace: saudeconecta }
spec:
  clusterIP: None
  selector: { app: db-pacientes }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db-pacientes, namespace: saudeconecta }
spec:
  serviceName: db-pacientes
  replicas: 1
  selector: { matchLabels: { app: db-pacientes } }
  template:
    metadata: { labels: { app: db-pacientes, camada: dados } }
    spec:
      containers:
        - name: db-pacientes
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: pacientes }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: pacientes-db, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pacientes-db, key: DB_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
