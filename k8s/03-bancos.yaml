---
apiVersion: v1
kind: Service
metadata: { name: db-triagem, namespace: saudeconecta }
spec:
  clusterIP: None
  selector: { app: db-triagem }
  ports: [{ port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db-triagem, namespace: saudeconecta }
spec:
  serviceName: db-triagem
  replicas: 1
  selector: { matchLabels: { app: db-triagem } }
  template:
    metadata: { labels: { app: db-triagem, camada: dados } }
    spec:
      containers:
        - name: db-triagem
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: triagem-db, key: DB_USER } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: triagem-db, key: DB_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: db-notificacoes, namespace: saudeconecta }
spec:
  clusterIP: None
  selector: { app: db-notificacoes }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db-notificacoes, namespace: saudeconecta }
spec:
  serviceName: db-notificacoes
  replicas: 1
  selector: { matchLabels: { app: db-notificacoes } }
  template:
    metadata: { labels: { app: db-notificacoes, camada: dados } }
    spec:
      containers:
        - name: db-notificacoes
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$DB_PASSWORD"']
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: notificacoes-db, key: DB_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
