# Credenciais. Valores de DESENVOLVIMENTO: em producao devem vir de um cofre
# (ex.: External Secrets / Sealed Secrets) e nunca ser versionados.
apiVersion: v1
kind: Secret
metadata:
  name: saudeconecta-secrets
  namespace: saudeconecta
type: Opaque
stringData:
  PACIENTES_DB_USER: pacientes
  PACIENTES_DB_PASSWORD: troque-me-pacientes
  AGENDAMENTO_DB_USER: agendamento
  AGENDAMENTO_DB_PASSWORD: troque-me-agendamento
  RABBITMQ_USER: saude
  RABBITMQ_PASSWORD: troque-me-rabbit
