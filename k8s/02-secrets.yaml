# Um Secret por servico: cada um recebe so a propria credencial.
# Valores de DESENVOLVIMENTO: em producao devem vir de um cofre
# (ex.: External Secrets / Sealed Secrets) e nunca ser versionados.
apiVersion: v1
kind: Secret
metadata:
  name: pacientes-db
  namespace: saudeconecta
type: Opaque
stringData:
  DB_USER: pacientes
  DB_PASSWORD: troque-me-pacientes
---
