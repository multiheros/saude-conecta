# Testes de integracao em ambiente descartavel (nao usa os volumes da stack).
# Um servico: docker compose -f docker-compose.test.yml run --build --rm pacientes
# Todos:      scripts/testar.sh
name: saudeconecta-testes
services:
  agendamento:
    build: { context: ., dockerfile: services/agendamento/Dockerfile, target: teste }
    environment: { DB_HOST: pg-agendamento, DB_USER: teste, DB_PASSWORD: teste, DB_NAME: teste, LEITURA_MONGO_HOST: mongo, LEITURA_REDIS_HOST: redis-leitura }
    depends_on: { pg-agendamento: { condition: service_healthy }, mongo: { condition: service_healthy }, redis-leitura: { condition: service_healthy } }
  pacientes:
    build: { context: ., dockerfile: services/pacientes/Dockerfile, target: teste }
    environment: { DB_HOST: pg-pacientes, DB_USER: teste, DB_PASSWORD: teste, DB_NAME: teste, RABBITMQ_HOST: rabbitmq, RABBITMQ_USER: teste, RABBITMQ_PASSWORD: teste }
    depends_on: { pg-pacientes: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
  notificacoes:
    build: { context: ., dockerfile: services/notificacoes/Dockerfile, target: teste }
    environment: { DB_HOST: redis }
    depends_on: { redis: { condition: service_healthy } }

  triagem:
    build: { context: ./services/triagem, target: teste }
    environment: { DB_HOST: mongo, RABBITMQ_HOST: rabbitmq, RABBITMQ_USER: teste, RABBITMQ_PASSWORD: teste }
    depends_on: { mongo: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }

  pg-agendamento: &pg
    image: postgres:16-alpine
    environment: { POSTGRES_USER: teste, POSTGRES_PASSWORD: teste, POSTGRES_DB: teste }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U teste -d teste"], interval: 2s, retries: 20 }
  pg-pacientes: *pg
  redis: &redis
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 20 }
  redis-leitura: *redis
  mongo:
    image: mongo:7
    tmpfs: [/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 3s, timeout: 5s, retries: 20 }
  rabbitmq:
    build: ./infra/rabbitmq
    environment: { RABBITMQ_USER: teste, RABBITMQ_PASSWORD: teste }
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"], interval: 4s, timeout: 8s, retries: 20, start_period: 8s }
