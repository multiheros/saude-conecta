# SaudeConecta - stack completa
# Sobe tudo com:          docker compose up -d --build
# Ja preparado e offline:  docker compose up -d --no-build   (antes: scripts/preparar.sh)
# Entrada unica: http://localhost:8080

# Volta sozinho se a maquina reiniciar.
x-node-service: &svc-defaults
  restart: unless-stopped

services:
  # ---------- Borda ----------
  # Kong sem banco. Valida o JWT com a chave publica; a privada so existe em Pacientes.
  gateway:
    image: saudeconecta/gateway:${IMAGENS_TAG:-1.0}
    build: ./gateway
    <<: *svc-defaults
    ports: ["${GATEWAY_PORTA:-8080}:8000"]
    environment:
      LIMITE_POR_MINUTO: ${LIMITE_POR_MINUTO:-100}
      LIMITE_REDIS_HOST: cache-gateway
      LIMITE_SENHA: ${GATEWAY_CACHE_PASSWORD:-troque-me-gateway}
    volumes: [chave-publica:/chaves:ro]
    networks: [frontend, backend, data-gateway]
    depends_on:
      chaves: { condition: service_completed_successfully }

  # Contador do limite de requisicoes, unico entre replicas do gateway. Se cair, o gateway libera.
  cache-gateway:
    image: redis:7-alpine
    <<: *svc-defaults
    environment:
      REDISCLI_AUTH: ${GATEWAY_CACHE_PASSWORD:-troque-me-gateway}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 32mb --maxmemory-policy allkeys-lru --requirepass \"$$REDISCLI_AUTH\""]
    networks: [data-gateway]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  bff-web:
    image: saudeconecta/bff-web:${IMAGENS_TAG:-1.0}
    build: { context: ., dockerfile: bff/web/Dockerfile }
    <<: *svc-defaults
    environment:
      PACIENTES_URL: http://pacientes:8001
      AGENDAMENTO_URL: http://agendamento:8002
      TRIAGEM_URL: http://triagem:8003
    networks: [frontend, backend]
    depends_on: [pacientes, agendamento, triagem]

  bff-admin:
    image: saudeconecta/bff-admin:${IMAGENS_TAG:-1.0}
    build: { context: ., dockerfile: bff/admin/Dockerfile }
    <<: *svc-defaults
    environment:
      PACIENTES_URL: http://pacientes:8001
      AGENDAMENTO_URL: http://agendamento:8002
      NOTIFICACOES_URL: http://notificacoes:8004
      TRIAGEM_URL: http://triagem:8003
      CACHE_SEGUNDOS: ${CACHE_SEGUNDOS:-30}
    networks: [frontend, backend]
    depends_on: [pacientes, agendamento, notificacoes]

  # ---------- Telas (arquivos estaticos, so pelo gateway) ----------
  web-paciente:
    image: saudeconecta/web-paciente:${IMAGENS_TAG:-1.0}
    build: { context: ./clientes, args: { APP: paciente } }
    <<: *svc-defaults
    networks: [frontend]

  web-gestor:
    image: saudeconecta/web-gestor:${IMAGENS_TAG:-1.0}
    build: { context: ./clientes, args: { APP: gestor } }
    <<: *svc-defaults
    networks: [frontend]

  # ---------- Servicos de dominio (cada um com seu banco) ----------
  pacientes:
    image: saudeconecta/pacientes:${IMAGENS_TAG:-1.0}
    build: { context: ., dockerfile: services/pacientes/Dockerfile }
    <<: *svc-defaults
    environment:
      DB_HOST: db-pacientes
      DB_PORT: "5432"
      DB_NAME: pacientes
      DB_USER: ${PACIENTES_DB_USER:-pacientes}
      DB_PASSWORD: ${PACIENTES_DB_PASSWORD:-troque-me-pacientes}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-saude}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-troque-me-rabbit}
      JWT_CHAVE_PRIVADA: /chaves/jwt.pem
      SEED: "true" # dados ficticios de demonstracao
      SEED_SENHA: ${SEED_SENHA:-demo12345}
    volumes: [chave-privada:/chaves:ro]
    networks: [backend, mensageria, data-pacientes]
    depends_on:
      db-pacientes: { condition: service_healthy }
      chaves: { condition: service_completed_successfully }

  # Gera o par de chaves do JWT uma unica vez. So Pacientes monta a privada.
  chaves:
    image: saudeconecta/chaves:${IMAGENS_TAG:-1.0}
    build: ./infra/chaves
    volumes: [chave-privada:/privada, chave-publica:/publica]
    network_mode: none

  agendamento:
    image: saudeconecta/agendamento:${IMAGENS_TAG:-1.0}
    build: { context: ., dockerfile: services/agendamento/Dockerfile }
    <<: *svc-defaults
    environment:
      TRIAGEM_URL: http://triagem:8003
      PACIENTES_URL: http://pacientes:8001
      NOTIFICACOES_URL: http://notificacoes:8004
      DB_HOST: db-agendamento
      DB_PORT: "5432"
      DB_NAME: agendamento
      DB_USER: ${AGENDAMENTO_DB_USER:-agendamento}
      DB_PASSWORD: ${AGENDAMENTO_DB_PASSWORD:-troque-me-agendamento}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-saude}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-troque-me-rabbit}
      LEITURA_MONGO_HOST: db-agendamento-leitura
      LEITURA_MONGO_USER: ${AGENDAMENTO_LEITURA_USER:-leitura}
      LEITURA_MONGO_PASSWORD: ${AGENDAMENTO_LEITURA_PASSWORD:-troque-me-leitura}
      LEITURA_REDIS_HOST: cache-agendamento
      LEITURA_REDIS_PASSWORD: ${AGENDAMENTO_CACHE_PASSWORD:-troque-me-cache}
      SEED: "true" # dados ficticios de demonstracao
    networks: [backend, mensageria, data-agendamento]
    # RabbitMQ e Read Model nao sao dependencia de partida: sem eles, os eventos esperam no Outbox ou na
    # fila e os comandos continuam.
    depends_on: { db-agendamento: { condition: service_healthy } }

  triagem:
    image: saudeconecta/triagem:${IMAGENS_TAG:-1.0}
    build: ./services/triagem
    <<: *svc-defaults
    environment:
      DB_HOST: db-triagem
      DB_PORT: "27017"
      DB_USER: ${TRIAGEM_DB_USER:-triagem}
      DB_PASSWORD: ${TRIAGEM_DB_PASSWORD:-troque-me-triagem}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-saude}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-troque-me-rabbit}
      CHROMA_HOST: db-triagem-vetores
      AGENDAMENTO_URL: http://agendamento:8002
      # Com as duas chaves vazias, a triagem trabalha por regras. Com as duas, vale o DeepSeek (LLM_PROVEDOR escolhe).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVEDOR: ${LLM_PROVEDOR:-}
      LLM_MODELO: ${LLM_MODELO:-}
      LLM_URL: ${LLM_URL:-}
    networks: [backend, mensageria, data-triagem]
    # A base vetorial nao e dependencia de partida: sem ela, a triagem responde sem citar fontes.
    depends_on: { db-triagem: { condition: service_healthy } }

  # Carrega a base de conhecimento no ChromaDB e termina. Se ja estiver carregada, nao faz nada.
  triagem-ingestao:
    image: saudeconecta/triagem:${IMAGENS_TAG:-1.0} # construida pelo servico triagem
    pull_policy: never
    restart: on-failure
    command: ["python", "-m", "app.rag.ingestao"]
    environment: { CHROMA_HOST: db-triagem-vetores }
    healthcheck: { disable: true }
    networks: [data-triagem] # sem internet: o modelo de embeddings ja vem na imagem
    depends_on: { db-triagem-vetores: { condition: service_healthy } }

  notificacoes:
    image: saudeconecta/notificacoes:${IMAGENS_TAG:-1.0}
    build: { context: ., dockerfile: services/notificacoes/Dockerfile }
    <<: *svc-defaults
    environment:
      DB_HOST: db-notificacoes
      DB_PORT: "6379"
      DB_PASSWORD: ${NOTIFICACOES_DB_PASSWORD:-troque-me-notificacoes}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-saude}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-troque-me-rabbit}
    networks: [backend, mensageria, data-notificacoes]
    depends_on: { db-notificacoes: { condition: service_healthy } }

  # ---------- Bancos: instancias separadas, volume proprio ----------
  db-pacientes:
    image: postgres:16-alpine
    <<: *svc-defaults
    environment:
      POSTGRES_DB: pacientes
      POSTGRES_USER: ${PACIENTES_DB_USER:-pacientes}
      POSTGRES_PASSWORD: ${PACIENTES_DB_PASSWORD:-troque-me-pacientes}
    volumes: [pacientes-data:/var/lib/postgresql/data]
    networks: [data-pacientes]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pacientes"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-agendamento:
    image: postgres:16-alpine
    <<: *svc-defaults
    environment:
      POSTGRES_DB: agendamento
      POSTGRES_USER: ${AGENDAMENTO_DB_USER:-agendamento}
      POSTGRES_PASSWORD: ${AGENDAMENTO_DB_PASSWORD:-troque-me-agendamento}
    volumes: [agendamento-data:/var/lib/postgresql/data]
    networks: [data-agendamento]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agendamento"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Read Model do Agendamento (CQRS): projecao duravel e cache de vagas. Ambos podem ser refeitos do PostgreSQL.
  db-agendamento-leitura:
    image: mongo:7
    <<: *svc-defaults
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AGENDAMENTO_LEITURA_USER:-leitura}
      MONGO_INITDB_ROOT_PASSWORD: ${AGENDAMENTO_LEITURA_PASSWORD:-troque-me-leitura}
    volumes: [agendamento-leitura-data:/data/db]
    networks: [data-agendamento]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache-agendamento:
    image: redis:7-alpine
    <<: *svc-defaults
    environment:
      REDISCLI_AUTH: ${AGENDAMENTO_CACHE_PASSWORD:-troque-me-cache}
    # So cache: sem persistencia, com limite de memoria.
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass \"$$REDISCLI_AUTH\""]
    networks: [data-agendamento]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-triagem:
    image: mongo:7
    <<: *svc-defaults
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TRIAGEM_DB_USER:-triagem}
      MONGO_INITDB_ROOT_PASSWORD: ${TRIAGEM_DB_PASSWORD:-troque-me-triagem}
    volumes: [triagem-data:/data/db]
    networks: [data-triagem]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base vetorial do RAG. O ChromaDB 1.x nao tem autenticacao: a protecao e a rede, que so a Triagem alcanca.
  db-triagem-vetores:
    image: chromadb/chroma:1.5.9
    <<: *svc-defaults
    environment: { ANONYMIZED_TELEMETRY: "FALSE" }
    volumes: [triagem-vetores-data:/data]
    networks: [data-triagem]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-notificacoes:
    image: redis:7-alpine
    <<: *svc-defaults
    environment:
      # Lida tambem pelo redis-cli (healthcheck)
      REDISCLI_AUTH: ${NOTIFICACOES_DB_PASSWORD:-troque-me-notificacoes}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    volumes: [notificacoes-data:/data]
    networks: [data-notificacoes]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Mensageria ----------
  rabbitmq:
    image: saudeconecta/rabbitmq:${IMAGENS_TAG:-1.0}
    <<: *svc-defaults
    build: ./infra/rabbitmq
    hostname: rabbitmq # o nome do no define a pasta de dados: fixo para nao perder filas
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-saude}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-troque-me-rabbit}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [mensageria]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

# Redes:
#  - frontend : gateway <-> BFFs (unica com porta publicada, via gateway)
#  - backend  : gateway/BFFs <-> servicos de dominio
#  - mensageria: servicos de dominio <-> RabbitMQ (interna)
#  - data-<x> : servico <x> <-> banco(s) de <x>, uma rede por servico. `internal: true`
#               => sem saida para fora e inalcancavel pelos demais servicos.
networks:
  frontend:
  backend:
  mensageria:
    internal: true
  data-pacientes:
    internal: true
  data-agendamento:
    internal: true
  data-triagem:
    internal: true
  data-notificacoes:
    internal: true
  data-gateway:
    internal: true

volumes:
  pacientes-data:
  agendamento-data:
  agendamento-leitura-data:
  triagem-data:
  triagem-vetores-data:
  notificacoes-data:
  rabbitmq-data:
  chave-privada:
  chave-publica:
